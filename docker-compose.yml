services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    environment:
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}    
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    container_name: app.local
    ports:
     - 5173:5173
    depends_on:
      pgrest:
        condition: service_started
  pgrest:
    container_name: pgrest.local
    image: postgrest/postgrest:v14.5
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PGRST_LOG_LEVEL=${PGRST_LOG_LEVEL}
      - PGRST_SERVER_HOST=${PGRST_SERVER_HOST}
      - PGRST_SERVER_PORT=${PGRST_SERVER_PORT}
      - PGRST_DB_PRE_CONFIG=${PGRST_DB_PRE_CONFIG}
      - PGRST_HOST=${PGRST_HOST}
      - PGRST_DB_URI=${PGRST_DB_URI}
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
  db:
    image: postgres:18
    container_name: db.local
    command: ["postgres", "-c", "log_statement=all", "-c", "listen_addresses=*"]
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 25

volumes:
  postgres-data:
  docker-data:
